# Rate limiting according to
# https://docs.nginx.com/nginx/admin-guide/security-controls/controlling-access-proxied-http/
# https://www.freecodecamp.org/news/nginx-rate-limiting-in-a-nutshell-128fe9e0126c/

# Help Center
limit_req_zone $binary_remote_addr zone=helpcenter:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=helpcenter_backend:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=helpcenter_backend_images:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=helpcenter_backend_submit_requests:10m rate=1r/s;

# MDR home
limit_req_zone $binary_remote_addr zone=mdr:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=mdr_static:10m rate=40r/s;

# DH home
limit_req_zone $binary_remote_addr zone=dh_home:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dh_home_static:10m rate=40r/s;

# DavRODS upload
# Use the authenticated user as the per-user key and fall back to the client IP.
map $remote_user $davrods_upload_identity {
    ""      $binary_remote_addr;
    default $remote_user;
}

# Empty keys are not counted, so non-PUT WebDAV requests remain unaffected.
map $request_method $davrods_upload_global_limit_key {
    default "";
    PUT     $server_name;
}

map $request_method $davrods_upload_user_limit_key {
    default "";
    PUT     $davrods_upload_identity;
}

# Smooth upload starts and cap the number of long-running uploads separately.
limit_req_zone $davrods_upload_global_limit_key zone=davrods_upload_put_global:10m rate=2r/s;
limit_req_zone $davrods_upload_user_limit_key zone=davrods_upload_put_user:10m rate=1r/s;
limit_conn_zone $davrods_upload_global_limit_key zone=davrods_upload_conn_global:10m;
limit_conn_zone $davrods_upload_user_limit_key zone=davrods_upload_conn_user:10m;
